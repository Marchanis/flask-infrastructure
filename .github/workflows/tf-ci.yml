name: Terraform Destroy

on:
  workflow_dispatch: # This lets you click "Run workflow" manually in GitHub

jobs:
  destroy:
    runs-on: ubuntu-latest
    permissions:
      id-token: required
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::889992886230:role/github-actions-terraform-role
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve