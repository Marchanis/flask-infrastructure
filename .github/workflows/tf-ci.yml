name : ci for terraform 

on: 
  pull_request:
    branches: [main]
      
jobs:
    test: 
      runs-on: ubuntu-latest

      permissions: 
        id-token: write
        contents: read

      steps:
      - uses: actions/checkout@v4

      # Authenticate to AWS  securely via OIDC 
      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          role-to-assume: arn:aws:iam::889992886230:role/github-actions-terraform-role
          aws-region: us-east-1

      - name: Ensure Terraform State Bucket Exists
        run: |
          aws s3api head-bucket --bucket flask-terraform-state-sall 2>/dev/null || \
          aws s3 mb s3://flask-terraform-state-sall --region us-east-1
        

      - uses: hashicorp/setup-terraform@v4
      
      - run: terraform fmt -check
      - run: terraform init 

      - run: terraform validate 
      - run: terraform plan 

  

  