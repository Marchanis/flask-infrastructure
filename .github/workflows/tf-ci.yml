name : ci for terraform 

on: 
  pull_request:
    branches: [main]

jobs:
    test: 
      runs-on: ubuntu-latest

      steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
      
      - run: terraform fmt -check
      - run: terraform init 

      - run: terraform validate 
      - run: terraform plan 

  

  